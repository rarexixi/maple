eureka:
  instance:
    metadata-map:
      version: 1.0
  client:
    serviceUrl:
      defaultZone: http://127.0.0.1:8761/eureka/

server:
  port: 8050

spring:
  application:
    name: maple-manager
  cache:
    type: redis
  redis:
    # cluster:
    #   nodes:
    #   max-redirects:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

management:
  endpoints:
    # 关闭所有的检查项
    enabled-by-default: false
    web:
      exposure:
        # 暴露监控接口，*为全部接口
        include: 'prometheus'
      ## 省掉了/actuator前缀
      base-path: "/"
  # 对外暴露prometheus接口并显示更多健康信息
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  ## 关闭内置的检查项
  metrics:
    enable:
      jvm: true
      logback: false
      files: false
      tomcat: false
      executor: false
      disk: false
      uptime: false
      integration: false

feign:
  okhttp:
    enabled: true

maple:
  manager:
    consume-job: false
    consume-job-period: 6000
    refresh-yarn: true
    yarn-refresh-period: 60000
    refresh-k8s: false
    k8s-refresh-period: 10000
  json-format:
    date-time-format: yyyy-MM-dd HH:mm:ss
    date-format: yyyy-MM-dd
    time-format: HH:mm:ss
  aspect:
    controller-method-pattern: "execution(public * org.xi.maple.manager.controller..*.*(..))"
