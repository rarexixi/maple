spring:
  datasource:
    url: jdbc:mysql://localhost:3306/maple?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&rewriteBatchedStatements=true&useServerPrepStmts=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai
    username: xi_root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

generator:
  encoding: UTF-8
  table-name-match-regex: '(?<=maple_).*'
  paths:
    template: ./template/                       # 模版路径
    out: ../                                    # 输出路径
  files:
    ignore:
      - include/
      - .DS_Store
    aggregate:
      - src/router/index.ts.ftl
      - src/App.vue
      - .env
      - .env.development
      - .env.production
      - .env.test
      - src/composables/service-apis.ts
    copy:
      - public/favicon.ico
      - public/index.html
      - src/assets/
      - src/components/ant-ext
      - src/components/DataOperations.vue
      - src/components/TableOperations.vue
      - src/components/UpsertCard.vue
      - src/composables/common.ts
      - src/composables/models.ts
      - src/composables/requests.ts
      - src/composables/table-operations.ts
      - src/composables/table-selection.ts
      - src/mixin/
      - src/store/
      - src/utils/
      - src/App.vue,
      - src/base_config.js,
      - src/main.js,
      - .gitignore
      - env.d.ts
      - index.html
      - package.json
      - package-lock.json
      - README.md
      - tsconfig.app.json
      - tsconfig.json
      - tsconfig.node.json
      - vite.config.ts

  columns:
    base:
      column-name-set: disabled,created_by,created_at,updated_by,updated_at
      table-name: maple_datasource_type
    not-required:
      - column-name-set: created_at
    cannot-update:
      - column-name-set: created_by,created_at
#    img-url:
#    video-url:
#    doc-url:
#    page-url:
#    other-url:
    fk-select:
      - column-name-set: datasource_type
        table-name: maple_datasource
        fk:
          foreign-table-name: maple_datasource_type
          value-column-name: type_name
          text-column-name: type_code
    content:
      - column-name-set: configurations, datasource_conf, material_conf, cluster_conf, ext_info, default_conf, exec_conf, exec_info, job_conf

    valid-status:
      - column-name-set: disabled
        status:
          valid: 0
          invalid: 1

  # 公共自定义属性
  common-properties:
    projectName: maple
    module: mp
    serviceApplicationName: MapleManagementPlatformApplication
    servicePort: 8082
    modulePackage: org.xi.maple.mp
    commonPackage: org.xi.maple.common
    commonStarterPackage: org.xi.maple.service

    author: 郗世豪（rarexixi@gmail.com）
    javaSrc: src/main/java
    javaTestSrc: src/test/java
    resourcesSrc: src/main/resources

  # 获取数据映射关系
  data-type-map:
    tinyint: Integer
    smallint: Integer
    int: Integer
    'unsigned int': Long
    bigint: Long
    float: Float
    double: Double
    decimal: BigDecimal
    numeric: BigDecimal
    bit: Boolean
    character: Character
    varchar: String
    char: String
    text: String
    tinytext: String
    mediumtext: String
    longtext: String
    json: String
    blob: byte[]
    tinyblob: byte[]
    mediumblob: byte[]
    longblob: byte[]
    date: LocalDate
    datetime: LocalDateTime
    timestamp: LocalDateTime
